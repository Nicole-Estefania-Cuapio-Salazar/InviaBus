<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eliminar empleado</title>
  <link rel="icon" href="img/conexion-global.gif">
  <link rel="stylesheet" href="hojas de estilo/consulesti.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<script>
let id_emp, id_jefe, num_departamento, conexion;

window.onload = function () {
  document.getElementById("bt_borrar").addEventListener("click", Borrarempleado);
  document.getElementById("bt_limpiar").addEventListener("click", limpiarCampos);
  document.getElementById("bt_regresar").addEventListener("click", regresarPagina);

  id_emp = document.getElementById("txt_id_emp");
  id_jefe = document.getElementById("txt_id_jefe");
  num_departamento = document.getElementById("txt_num_departamento");
};

function limpiarCampos() {
  ["txt_id_emp", "txt_id_jefe", "txt_num_departamento"].forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.value = "";
  });
}

function Borrarempleado() {
  if (!id_emp.value.trim() || !id_jefe.value.trim() || !num_departamento.value.trim()) {
    Swal.fire('Atención', 'Ingrese todos los datos para eliminar.', 'warning');
    return;
  }

  let valor_id_emp = parseInt(id_emp.value.trim());
  let valor_id_jefe = parseInt(id_jefe.value.trim());
  let valor_num_departamento = parseInt(num_departamento.value.trim());

  conexion = new XMLHttpRequest();
  conexion.open("POST", "eliminar.php", true);
  conexion.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
  conexion.onreadystatechange = esperaRespuesta;
  conexion.send(
    "id_emp_php=" + valor_id_emp +
    "&id_jefe_php=" + valor_id_jefe +
    "&num_departamento_php=" + valor_num_departamento
  );
}

function esperaRespuesta() {
  if (conexion.readyState === 4 && conexion.status === 200) {
    Swal.fire('Resultado', conexion.responseText, 'info');
  }
}

    function regresarPagina() {
        const swalWithBootstrapButtons = Swal.mixin({
            customClass: {
                confirmButton: "btn btn-success",
                cancelButton: "btn btn-danger"
            },
            buttonsStyling: false
        });

        swalWithBootstrapButtons.fire({
            title: "¿Estás seguro?",
            text: "Se perderán los datos del formulario.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Sí, regresar",
            cancelButtonText: "No, cancelar",
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                swalWithBootstrapButtons.fire({
                    title: "Regresando",
                    text: "Serás redirigido a la página principal.",
                    icon: "success"
                }).then(() => {
                    window.location.href = "pagina_principal.html";
                });
            } else if (result.dismiss === Swal.DismissReason.cancel) {
                swalWithBootstrapButtons.fire({
                    title: "Cancelado",
                    text: "Te has quedado en esta página.",
                    icon: "error"
                });
            }
        });
    }
    window.onload = cargar;
    
</script>
<body class="d-flex justify-content-center align-items-center">
  <div class="card-container">
        <center>
      <h5 class="form-title">
        <img src="img/agregar-usuario.gif" width="40" height="40" alt="icono">
            Baja de empleado
        </h5>
          </center>
        <form>
          <div class=" shadow-lg p-2 mb-2 rounded">
            <input type="text" id="txt_id_emp" class="form-control" placeholder="ID del empleado">
          </div>
          <div class="shadow-lg p-2 mb-2 rounded">
            <input type="text" id="txt_id_jefe" class="form-control" placeholder="ID del jefe">
          </div>
          <div class="shadow-lg p-2 mb-2 rounded">
            <input type="text" id="txt_num_departamento" class="form-control" placeholder="Número de departamento">
          </div>
          <div class="btn-group-custom">
            <button type="button" id="bt_borrar" class="btn btn-dark">Eliminar</button>
            <button type="button" id="bt_limpiar" class="btn btn-warning">Limpiar</button>
            <button type="button" id="bt_regresar" class="btn btn-success">Regresar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

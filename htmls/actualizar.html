<html lang="es">
<head>

  <link rel="stylesheet" href="hojas de estilo/ESTILO_ACTUALIZAR.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  
  function agregarEvento(ele, eve, fun, cap) {
    if (window.attachEvent) {
      ele.attachEvent('on' + eve, fun);
    } else {
      ele.addEventListener(eve, fun, cap);
    }
  }
    window.onload = function () {
  // Asignar eventos
  document.getElementById("bt_limpiar").addEventListener("click", limpiarCampos);
};

function limpiarCampos() {
  const campos = [
    "txt_id_emp", "txt_nombre", "txt_apellido_p", "txt_apellido_m",
    "txt_area_trabajo", "txt_salario", "txt_celular", "txt_jefearea"
  ];

  campos.forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.value = "";
  });
}

  /*function Regresar() {
    window.location.href = "pagina_principal.html"; //regresa a la pagina principal por medio del botón 
  }*/
  function consultarEmpleado() {
    const id_emp = document.getElementById("txt_id_emp").value.trim();
//una variable de tipo constante para que solo se pueda definir en esta función 
    if (!id_emp) {
      Swal.fire('Atención', 'Por favor ingrese una matrícula válida.', 'warning');
      return; //alerta en el cual nos idica que la matricula es invlaida o bien no existe como tal 
    }

    const conexion = new XMLHttpRequest();
    conexion.open("POST", "respuestaconsu.php", true);
    conexion.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
    conexion.send("accion=consultar&id_emp=" + encodeURIComponent(id_emp)); //una url el cual acción sera igual a consutla que
                                                                //estara ligada con el id y con el mas indicando el campo con el que 
                                                                //se hara referencia.

    conexion.onreadystatechange = function () {  //una función que nos permita hacer la consulta en el cual recuperara los datos                                                          
          if (conexion.readyState == 4) {  //si la conexión es correcta mediante la variable datos y junto a la conexión.resposeText 
        const datos = conexion.responseText.split('|');//nos permita el extraer los datos asi mismo, con el | y split los separqa 

        if (datos[0] === "ERROR") {  //si lso datos son erronesos nos marcara un error el cual lo atrapara el sweealert
          Swal.fire("Error", datos[1], "error");
        } else {
          document.getElementById("txt_nombre").value = datos[0]; //si es correcto id nos arrojara los datos enumerados 
          document.getElementById("txt_apellido_p").value = datos[1]; // se veran por medio de los txt 
          document.getElementById("txt_apellido_m").value = datos[2];
          document.getElementById("txt_area_trabajo").value = datos[3];
          document.getElementById("txt_salario").value = datos[4];
          document.getElementById("txt_celular").value = datos[5];
          document.getElementById("txt_jefearea").value = datos[6];
          document.getElementById("txt_id_jefe").value = datos[7];

     //<!--nos permite manipular los campos o  bien poder cambiar los datos y hacer la actualización--->//
          document.getElementById("txt_nombre").readOnly = false;
          document.getElementById("txt_apellido_p").readOnly = false;
          document.getElementById("txt_apellido_m").readOnly = false;
          document.getElementById("txt_area_trabajo").readOnly = false;
          document.getElementById("txt_salario").readOnly = false;
          document.getElementById("txt_celular").readOnly = false;
          document.getElementById("txt_jefearea").readOnly = false;
          document.getElementById("txt_id_jefe").readOnly = false;
        }
      }
    };
  }

  function actualizarEmpleado() {  
    /*en esta función definimos las variables de forma const para que solo se puedan ocupar en esta función 
    id fue ocupado anterior mente pero se puede volver a definir ya que su función termino anterior mente*/        
    const id = document.getElementById("txt_id_emp").value.trim();
    const nombre = document.getElementById("txt_nombre").value.trim();
    const apellidop = document.getElementById("txt_apellido_p").value.trim(); //el value.trim nos permite borrar los espación en blanco 
    const apellidom = document.getElementById("txt_apellido_m").value.trim();//que se lleguen a encontar al momenot de la función 
    const area = document.getElementById("txt_area_trabajo").value.trim();
    const salario = document.getElementById("txt_salario").value.trim();
    const celular = document.getElementById("txt_celular").value.trim();
    const jefe = document.getElementById("txt_jefearea").value.trim();

    const datos = `id_emp=${id}&nombre=${nombre}&apellido_p=${apellidop}&apellido_m=${apellidom}
    &area=${area}&salario=${salario}&celular=${celular}&jefe=${jefe}`;
       //para facilitar el llamar uno por uno a los datos a mandar al php se hace una variable que almacenara tos esots datos 
    const conexion = new XMLHttpRequest();
    conexion.open("POST", "actualizadatos.php", true);
    conexion.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
    conexion.send(datos); //para evitar el $POST  se creo la variable datos
    conexion.onreadystatechange = function () {
      if (conexion.readyState == 4) { //si la conexión es correcta o no nos mandara a alguna de las alertas 
        if (conexion.responseText === "OK") {
          Swal.fire("Éxito", "Se actualizaron los datos de manera satisfactoria", "success"); //si es correcto 
        } else {
          Swal.fire("Error", "los datos siguen iguales, Por favor haga su actulaización", "error");//de no ser correcto
        }
      }
    };
  }

  function esperaRespuesta() {
        if (conexion.readyState == 4) {
            alert(conexion.responseText); // Mostramos la respuesta en un alert simple
        }
    }


   function regresarPagina() {
        const swalWithBootstrapButtons = Swal.mixin({
            customClass: {
                confirmButton: "btn btn-success",
                cancelButton: "btn btn-danger"
            },
            buttonsStyling: false
        });

        swalWithBootstrapButtons.fire({
            title: "¿Estás seguro?",
            text: "Se perderán los datos del formulario.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Sí, regresar",
            cancelButtonText: "No, cancelar",
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                swalWithBootstrapButtons.fire({
                    title: "Regresando",
                    text: "Serás redirigido a la página principal.",
                    icon: "success"
                }).then(() => {
                    window.location.href = "pagina_principal.html";
                });
            } else if (result.dismiss === Swal.DismissReason.cancel) {
                swalWithBootstrapButtons.fire({
                    title: "Cancelado",
                    text: "Te has quedado en esta página.",
                    icon: "error"
                });
            }
        });
    }

</script>
 <body class="d-flex justify-content-center align-items-center">
  <div class="card-container">
        <div class="shadow-lg p-3 mb-4 rounded">
          <h3 class="text-center">
            <i>
              <img src="img/reloj-de-arena.gif" width="60" height="60" alt="icono">
             Actualizar la información del empleado
            </i>
          </h3>
          <div class="card-body">
            <form>
              <div class="mb-1">
                <input type="text" id="txt_id_emp" class="form-control" placeholder="Ingrese el id del empleado" required>
              </div>
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-dark" onclick="consultarEmpleado()">Consultar</button>
                   <button type="button" class="btn btn-light" id="bt_limpiar">Limpiar</button>
                 <div class="d-grid gap-2 mt-2">
                    <button type="button" onclick="actualizarEmpleado()" class="btn btn-warning">Actualizar</button>
                </div>
              </div>
              <hr>
              <div class="mb-2">
                <input type="text" id="txt_nombre" class="form-control" placeholder="Nombre" readonly>
              </div>
              <div class="mb-2">
                <input type="text" id="txt_apellido_p" class="form-control" placeholder="Apellido paterno" readonly>
              </div>
              <div class="mb-2">

              </div>
              <div class="mb-2">
                <input type="text" id="txt_area_trabajo" class="form-control" placeholder="Área de trabajo" readonly>
              </div>
              <div class="mb-2">

              </div>
              <div class="mb-2">

              </div>
              <br>
              <div class="d-grid gap-2 ">
                <button type="button" class="btn btn-success" id="bt_regresar" onclick="regresarPagina()">Regresar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

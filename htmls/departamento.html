<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta y Baja de pertenencia en departamento </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="img/conexion-global.gif">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="hojas de estilo/dept.css">
  <script>
    let id_jefe, area_trabajo, id_empleado, num_departamento, guardar, eliminaenBd, regresar, limpiar, conexion;

    function agregarEvento(ele, eve, fun, cap) {
      if (window.attachEvent) {
        ele.attachEvent('on' + eve, fun);
      } else {
        ele.addEventListener(eve, fun, cap);
      }
    }

    function cargar() {
      num_departamento = document.getElementById("txt_num_departamento");
      area_trabajo = document.getElementById("txt_area_trabajo");
      id_empleado = document.getElementById("txt_id_empleado");
      id_jefe = document.getElementById("txt_id_jefe");
      guardar = document.getElementById("bt_guardar");
      eliminaenBd = document.getElementById("bt_eliminaenBd");
      regresar = document.getElementById("bt_regresar");
      limpiar = document.getElementById("bt_limpiar");

      guardar.addEventListener('click', conexionServidor, false);
      eliminaenBd.addEventListener('click', eliminarRegistro, false);
      regresar.addEventListener('click', regresarPagina, false);
      limpiar.addEventListener('click', limpiarCampos, false);
    }

    function conexionServidor() {
      let valor_num_departamento = num_departamento.value.trim();
      let valor_area_trabajo = area_trabajo.value.trim();
      let valor_id_empleado = id_empleado.value.trim();
      let valor_id_jefe = id_jefe.value.trim();

      if (valor_num_departamento === "" || valor_area_trabajo === "" || valor_id_empleado === "" || valor_id_jefe === "") {
    Swal.fire("Error", "Para guardar, es necesario llenar todos los campos.","warning");
    return;
  }

      conexion = new XMLHttpRequest();
      conexion.onreadystatechange = esperaRespuesta;
      conexion.open("POST", "registrodeparta.php", true);
      conexion.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
      conexion.send("num_departamento_php="+valor_num_departamento+
        "&area_trabajo_php="+valor_area_trabajo+
        "&id_empleado_php="+valor_id_empleado+
        "&id_jefe_php="+valor_id_jefe);
    }

    function eliminarRegistro() {
      let valor_num_departamento = num_departamento.value.trim(); // se encontro un erro al momento de estar programando y ejecuntando el proyecto 

      if (valor_num_departamento === "") {
        Swal.fire("Error", "Debes escribir el número del departamento a eliminar", "error");
        return;
      }

      conexion = new XMLHttpRequest();
      conexion.onreadystatechange = esperaRespuesta;
      conexion.open("POST", "eliminarDept.php", true);
      conexion.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
      conexion.send("num_departamento_php=" + encodeURIComponent(valor_num_departamento));
    }

    function esperaRespuesta() {
      if (conexion.readyState === 4 && conexion.status === 200) {
        Swal.fire("Respuesta", conexion.responseText, "info");
      }
    }

    function regresarPagina() {
      const swalWithBootstrapButtons = Swal.mixin({
        customClass: {
          confirmButton: "btn btn-success",
          cancelButton: "btn btn-danger"
        },
        buttonsStyling: false
      });

      swalWithBootstrapButtons.fire({
        title: "¿Estás seguro?",
        text: "Se perderán los datos del formulario.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, regresar",
        cancelButtonText: "No, cancelar",
        reverseButtons: true
      }).then((result) => {
        if (result.isConfirmed) {
          swalWithBootstrapButtons.fire({
            title: "Regresando",
            text: "Serás redirigido a la página principal.",
            icon: "success"
          }).then(() => {
            window.location.href = "pagina_principal.html";
          });
        } else if (result.dismiss === Swal.DismissReason.cancel) {
          swalWithBootstrapButtons.fire("Cancelado", "Te has quedado en esta página.", "error");
        }
      });
    }

    function limpiarCampos() {
      num_departamento.value = "";
      area_trabajo.value = "";
      id_empleado.value = "";
      id_jefe.value = "";
    }

    window.onload = cargar;
  </script>
</head>
<body class="d-flex justify-content-center align-items-center">
  <div class="card-container">
    <center>
      <h5 class="shadow-lg form-title rounded">
        <img src="img/cultura-corporativa.gif" width="40" height="40" alt="icono">
        Departamento: Alta o Baja de Empleado
      </h5>
    </center>
    <form>
      <div class="mb-2">
        <input type="text" class="form-control" id="txt_area_trabajo" placeholder="Área de trabajo">
      </div>
      <div class="mb-2">
        <input type="text" class="form-control" id="txt_id_jefe" placeholder="ID del Coordinador">
      </div>
      <div class="mb-2">
        <input type="text" class="form-control" id="txt_id_empleado" placeholder="ID del empleado">
      </div>
      <div class="mb-2">
        <input type="text" class="form-control" id="txt_num_departamento" placeholder="Número de Departamento">
      </div>
      <div class="btn-group-custom">
        <button type="button" class="btn btn-dark" id="bt_guardar">Guardar</button>
        <button type="button" class="btn btn-warning" id="bt_limpiar">Limpiar</button>
        <button type="button" class="btn btn-light" id="bt_eliminaenBd">Eliminar</button>
        <button type="button" class="btn btn-success" id="bt_regresar">Regresar</button>
      </div>
    </form>
  </div>
</body>
</html>
